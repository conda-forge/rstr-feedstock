# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"
  python_check_max: "3.15"

package:
  name: rstr
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/rstr/rstr-${{ version }}.tar.gz
  sha256: 1a1e7f304b0291edbc12955a9cb4093bfe1c7c1d48e0797e752bb3bf2a24574a

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=3.4.3
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/rstr/**
      site_packages:
        - rstr/**
        - rstr-${{ version }}.dist-info/**
  - python:
      imports: rstr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
    requirements:
      run:
        - mypy
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      - coverage run --source=rstr --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=95
      - mypy --strict -p rstr --no-warn-unused-ignores

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Generate random strings in Python
  homepage: https://pypi.org/project/rstr
  repository: https://github.com/leapfrogonline/rstr

extra:
  recipe-maintainers:
    - bollwyvl
